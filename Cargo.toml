[package]
name = "rumbo-gui"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = "2.5.0"
base64 = "0.23.1"
imagesize = "0.14.0"
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ui = { path = "crates/ui" }

[workspace]
members = ["crates/ui", "crates/overview"]
