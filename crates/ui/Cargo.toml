[package]
name = "ui"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
futures = "0.3.34"
gpui = { package = "gpui-pre", version = "=0.3.12" }
latex-rust = "3.0.3"
markdown = "1.0.0"
merman = "0.10.0"
serde_json = "1.0.154"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
unicode-segmentation = "1.13.3"
ureq = "3.5.2"

[dev-dependencies]
# A window in the test's own process, for the pointer to be simulated on.
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
