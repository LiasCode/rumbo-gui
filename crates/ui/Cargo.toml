[package]
name = "ui"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12" }
markdown = "1.0.0"
unicode-segmentation = "1.13.3"

[dev-dependencies]
# A window in the test's own process, for the pointer to be simulated on.
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
